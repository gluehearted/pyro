project:
  name: pyrosense
  seed: 42
  version: "1.0"

paths:
  root: .
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: models
  outputs: outputs

data_sources:
  era5:
    instant_path: data/raw/era5/data_stream-oper_stepType-instant.nc
    accum_path: data/raw/era5/data_stream-oper_stepType-accum.nc

    variables:
      instant:
        - t2m
        - d2m
        - u10
        - v10
        - sp

      accum:
        - tp
        - ssrd

  fires_modis:
    path: data/raw/fires/modis/DL_FIRE_M-C61_750447/fire_archive_M-C61_750447.csv
    type: csv
    confidence_threshold: 30

  fires_viirs:
    path: data/raw/fires/viirs/DL_FIRE_SV-C2_750448/fire_archive_SV-C2_750448.csv
    type: csv
    confidence_threshold: 30

  peatlands:
    paths:
      - data/raw/gfw/tif/*.tif
    type: raster
    peat_threshold: 0

  photos:
    root: data/raw/photos
    use_for: ["visual_validation", "documentation"]

roi:
  combined_bbox: [94.0, -6.5, 120.5, 8.5]
  sumatera_bbox: [94.0, -6.5, 106.5, 6.5]
  kalimantan_bbox: [108.0, -5.5, 120.5, 8.5]

processing:
  crs: "EPSG:4326"
  target_resolution_deg: 0.01
  target_time_freq: "1D"
  chunks:
    time: 30
    lat: 256
    lon: 256

cleaning:
  era5:
    temp_kelvin_to_celsius: true
    interpolate_missing: true
    interpolation_method: "linear"
  fires:
    remove_duplicates: true
    min_confidence: 30
    deduplicate_distance_m: 1000
  peatlands:
    clip_to_roi: true
    resample_method: "nearest"

feature_engineering:
  sequence_length: 7
  forecast_horizon: 1
  rolling_windows: [3, 7, 14]
  derived_features:
    - month
    - dayofyear
    - sin_doy
    - cos_doy
    - rainfall_sum_3d
    - rainfall_sum_7d
    - temperature_mean_3d
    - temperature_mean_7d
    - humidity_mean_7d
    - wind_speed_mean_7d
    - hotspot_count_7d
    - peatland_fraction
    - historical_fire_density

normalization:
  method: standard
  per_channel: true

split:
  method: temporal
  train_start: "2015-01-01"
  train_end: "2022-12-31"

  val_start: "2023-01-01"
  val_end: "2023-12-31"

  test_start: "2024-01-01"
  test_end: "2024-12-24"

  spatial_holdout: false

export:
  cnn:
    dir: data/processed/cnn
    format: npy
  xgb:
    dir: data/processed/xgb
    format: parquet
  metadata:
    dir: data/processed/metadata
    file: metadata.json

labeling:
  horizons:
    - 1
    - 3
    - 7